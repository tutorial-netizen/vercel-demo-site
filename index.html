<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple demo website for learning how to deploy with Vercel.">
  <title>Vercel Demo Site</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <div class="eyebrow">YOUR FIRST DEPLOYMENT</div>
    <h1>Hello, Vercel! <span aria-hidden="true">🚀</span></h1>
    <p class="intro">This is a sample website deployed from a GitHub repository.</p>
    <button id="demo-button" type="button">Test the button</button>
    <p id="message" class="message" aria-live="polite">Your site is ready to go.</p>
    <footer>Built for a beginner-friendly Vercel tutorial</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
